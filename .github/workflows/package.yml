# 打安装包：Windows 安装程序（Inno Setup），macOS 磁盘映像（Apple 芯片和 Intel 各一个）。
# 推送到 main 或手动运行时打包，安装包在运行页面的 Artifacts 里（登录 GitHub 后下载）；
# 推送 v 开头的标签（例如 v0.3.0）时再发布到 Releases，不登录也能下载。
# 每个安装包打好后都先装上跑一遍：分析演示音频，打开桌面窗口确认界面能显示（packaging/check_app.sh）。
name: 打包

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # 发布 Release

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
          - name: macos-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.12"
      PYTHONIOENCODING: utf-8
      VOICEDETECT_MODELS: ${{ github.workspace }}/.models
      VOICEDETECT_HOME: ${{ github.workspace }}/.check-home  # 检查时的数据目录，不进安装包
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0  # 这个仓库从 v8 起只发完整版本号

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: uv sync --locked --group build

      - name: 构建界面
        working-directory: frontend
        run: npm ci && npm run build

      - name: 读版本号
        run: |
          version=$(uv run python -c "import voicedetect; print(voicedetect.__version__)")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
              echo "::error::标签 $GITHUB_REF_NAME 和程序版本 $version 不一致"
              exit 1
            fi
            if ! grep -q "^## $version" CHANGELOG.md; then
              echo "::error::CHANGELOG.md 里还没有写 $version 这一版改了什么"
              exit 1
            fi
          fi

      - name: 打包程序
        run: uv run pyinstaller packaging/voicedetect.spec --noconfirm

      - name: 制作并安装安装程序（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 出错时把原因写成标注：不登录看不到运行日志
          function Fail($title, $log) {
            $tail = (Get-Content $log -Tail 20 -ErrorAction SilentlyContinue) -join "%0A"
            Write-Output "::error title=$title::$tail"
            exit 1
          }
          $compileLog = Join-Path $env:RUNNER_TEMP "iscc.log"
          iscc "/DAppVersion=$env:VERSION" packaging\installer.iss *> $compileLog  # 这台机器上 iscc 在 PATH 里
          if ($LASTEXITCODE -ne 0) { Fail "编译安装程序失败（退出码 $LASTEXITCODE）" $compileLog }
          $installer = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          Write-Output "::notice title=安装程序::$($installer.Name)，$([math]::Round($installer.Length / 1MB)) MB"
          $target = Join-Path $env:RUNNER_TEMP "app"
          $setupLog = Join-Path $env:RUNNER_TEMP "setup.log"
          $arguments = "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$target`"", "/LOG=`"$setupLog`""
          $setup = Start-Process -Wait -PassThru -FilePath $installer.FullName -ArgumentList $arguments
          if ($setup.ExitCode -ne 0) { Fail "安装失败（退出码 $($setup.ExitCode)）" $setupLog }
          $exe = Join-Path $target "VoiceDetect.exe"
          if (-not (Test-Path $exe)) { Fail "安装后找不到 VoiceDetect.exe" $setupLog }
          "APP_EXE=$exe" >> $env:GITHUB_ENV

      - name: 找到程序（macOS）
        if: runner.os == 'macOS'
        run: echo "APP_EXE=$PWD/dist/AI盯播助手.app/Contents/MacOS/VoiceDetect" >> "$GITHUB_ENV"

      - name: 缓存识别模型
        uses: actions/cache@v6
        with:
          path: .models
          key: sensevoice-${{ hashFiles('voicedetect/asr/models.py') }}

      - name: 下载识别模型
        run: uv run voicedetect models download --source huggingface

      - name: 检查打包好的程序
        run: bash packaging/check_app.sh "$APP_EXE"

      - name: 制作磁盘映像（macOS）
        if: runner.os == 'macOS'
        run: |
          arch=$(uname -m | sed 's/x86_64/x64/')
          mkdir dist/dmg
          ditto "dist/AI盯播助手.app" "dist/dmg/AI盯播助手.app"
          ln -s /Applications dist/dmg/Applications  # 打开映像后直接拖进“应用程序”
          dmg="dist/VoiceDetect-$VERSION-macos-$arch.dmg"  # 文件名不用中文：GitHub 发布时会把中文去掉
          hdiutil create -volname "AI 盯播助手" -srcfolder dist/dmg -ov -format UDZO "$dmg"
          echo "::notice title=磁盘映像::$(basename "$dmg")，$(( $(stat -f %z "$dmg") / 1048576 )) MB"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 说明 = CHANGELOG.md 里这一版的那一节 + 下载和安装说明
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## $version" 'index($0, head) == 1 { keep = 1; next } /^## / { keep = 0 } keep' CHANGELOG.md > notes.md
          printf '\n' >> notes.md
          cat packaging/release-notes.md >> notes.md
          # 文件名是英文，再配上中文说明：发布页面上显示说明，下载下来的文件用英文名
          assets=()
          for file in out/*; do
            case "$file" in
              *windows-setup.exe) label="Windows 安装包（Windows 10/11，64 位）" ;;
              *macos-arm64.dmg) label="Mac 安装包（Apple 芯片：M1、M2、M3……）" ;;
              *macos-x64.dmg) label="Mac 安装包（Intel 芯片）" ;;
              *) label="$(basename "$file")" ;;
            esac
            assets+=("$file#$label")
          done
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "AI 盯播助手 $version" --notes-file notes.md
          echo "::notice title=已发布::$(ls out | tr '\n' ' ')"

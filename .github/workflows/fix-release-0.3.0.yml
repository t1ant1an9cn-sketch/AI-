# 一次性修正：发布 0.3.0 时，GitHub 把安装包文件名里的中文去掉了（变成 AI.-0.3.0-.exe 这样）。
# 这里把三个文件改成英文名、配上中文说明，并换上新的发布说明。只在这个文件改动时运行，跑完就删掉它。
name: 修正 0.3.0 的安装包文件名

on:
  push:
    branches: [main]
    paths: [".github/workflows/fix-release-0.3.0.yml"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 改文件名和发布说明
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v0.3.0
          api="repos/$GITHUB_REPOSITORY/releases"
          gh api "$api/tags/$tag" --jq '.assets[] | "\(.id) \(.name)"' > assets.txt
          while read -r id name; do
            case "$name" in
              *.exe) new="VoiceDetect-0.3.0-windows-setup.exe"; label="Windows 安装包（Windows 10/11，64 位）" ;;
              *arm64.dmg) new="VoiceDetect-0.3.0-macos-arm64.dmg"; label="Mac 安装包（Apple 芯片：M1、M2、M3……）" ;;
              *x64.dmg) new="VoiceDetect-0.3.0-macos-x64.dmg"; label="Mac 安装包（Intel 芯片）" ;;
              *) continue ;;
            esac
            gh api -X PATCH "$api/assets/$id" -f name="$new" -f label="$label" > /dev/null
          done < assets.txt
          awk 'index($0, "## 0.3.0") == 1 { keep = 1; next } /^## / { keep = 0 } keep' CHANGELOG.md > notes.md
          printf '\n' >> notes.md
          cat packaging/release-notes.md >> notes.md
          gh release edit "$tag" --notes-file notes.md > /dev/null
          result=$(gh api "$api/tags/$tag" --jq '[.assets[] | "\(.name)：\(.label)"] | join("；")')
          echo "::notice title=已修正::$result"
